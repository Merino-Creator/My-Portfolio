<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <link rel="icon" type="image/x-icon" href="./assets/images/logo.png">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style/standard.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/hero.css">
    <link rel="stylesheet" href="./style/about.css">
    <link rel="stylesheet" href="./style/skills.css">
    <link rel="stylesheet" href="./style/projects.css">
    <link rel="stylesheet" href="./style/contact.css">
    <link rel="stylesheet" href="./style/footer.css">

</head>

<body>

    <main>

        <section class="hero">

            <header>
                <div class="content-wrapper">
                    <div class="nav-bar">
                        <img class="logo" src="./assets/images/logo.png" alt="logo of website in header">
                        <div class="header-tabs">
                            <a href="">About me</a>
                            <a href="">Skills</a>
                            <a href="">Projects</a>
                            <a href="">Contact</a>
                        </div>
                        <div class="language-btn">
                            <p>EN</p>
                            <div class="toggle-track">
                                <img class="vector-bar" src="./assets/images/header/vector-bar.png" alt="">
                                <img class="vector-point" src="./assets/images/header/vector-point.png" alt="">
                            </div>
                            <p>DE</p>
                        </div>
                    </div>
                </div>
            </header>

            <div class="hero-content-wrapper">
                <div class="hero-contact-links">
                    <img src="./assets/images/hero/linkedin-btn.png" alt="">
                    <img src="./assets/images/hero/github-btn.png" alt="">
                    <img src="./assets/images/hero/email-btn.png" alt="">
                </div>
                <div class="hero-content">
                    <div class="hero-top">
                        <div class="hero-top-left">
                            <img class="hello-world-img" src="./assets/images/hero/hello-world.png" alt="">
                            <img class="frontend-img" src="./assets/images/hero/frontend.png" alt="">
                        </div>
                        <div class="hero-top-right">
                            <img class="photo-frame-img" src="./assets/images/hero/polaroid-frame.png" alt="">
                        </div>
                    </div>
                    <div class="hero-bottom">
                        <img class="developer-img" src="./assets/images/hero/developer.png" alt="">
                        <img class="getintouch-img" src="./assets/images/hero/getintouch.png" alt="">
                    </div>
                </div>
            </div>
        </section>

        <section class="about">
            <div class="content-wrapper">
                <div class="about-content">
                    <div class="location">
                        <div class="green">
                            <img class="about-ripped-img" src="./assets/images/about-me/green.png" alt="">
                            <div class="yellow-text">
                                <img class="about-img" src="./assets/images/about-me/location-pin.png" alt="">
                                <p>Based in Stuttgart</p>
                            </div>
                        </div>
                        <div class="purple">
                            <img class="about-ripped-img" src="./assets/images/about-me/purple.png" alt="">
                            <div class="blue-text">
                                <img class="about-img" src="./assets/images/about-me/location-way.png" alt="">
                                <p>Open to relocate</p>
                            </div>
                        </div>
                        <div class="brown">
                            <img class="about-ripped-img" src="./assets/images/about-me/brown.png" alt="">
                            <div class="orange-text">
                                <img class="about-img" src="./assets/images/about-me/location-house.png" alt="">
                                <p>Open to work remote</p>
                            </div>
                        </div>
                    </div>
                    <div class="about-me">
                        <div class="about-me-top">
                            <h3>WHO´S DANIEL?</h3>
                            <h2>About me</h2>
                            <img class="about-underline" src="./assets/images/about-me/underline.png" alt="">
                        </div>
                        <div class="about-me-bottom">
                            <p>lore ipsum</p>
                            <button class="lets-talk-btn">
                                <img src="./assets/images/about-me/lets-talk-btn.png" alt="">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="skills ">
            <div class="content-wrapper">
                <div class="skills-content"></div>
            </div>
        </section>

        <section class="projects">
            <div class="content-wrapper">
                <div class="projects-content"></div>
            </div>
        </section>

        <section class="contact">
            <div class="content-wrapper">
                <div class="contact-content"></div>
            </div>

            <footer>
                <div class="content-wrapper">
                    <div class="contact-bar">
                        <div class="legal-notice">
                            <img class="logo" src="./assets/images/logo.png" alt="logo of website in footer">
                            <p>Daniel Stürmer 2026 </p>
                            <a href="">Legal Notice</a>
                        </div>
                        <a href="">GitHub</a>
                        <a href="">LinkedIn</a>
                        <a href="">Email</a>
                    </div>
                </div>
            </footer>

        </section>

    </main>

</body>

<script src="./script.js"></script>

</html>

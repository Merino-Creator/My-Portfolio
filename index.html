<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Daniel Stuermer</title>

    <link rel="icon" type="image/x-icon" href="./assets/images/logo.png">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style/standard.css">
    <link rel="stylesheet" href="./style/keyframes.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/hero.css">
    <link rel="stylesheet" href="./style/about.css">
    <link rel="stylesheet" href="./style/skills.css">
    <link rel="stylesheet" href="./style/projects.css">
    <link rel="stylesheet" href="./style/contact.css">
    <link rel="stylesheet" href="./style/footer.css">

</head>

<body onload="init()">

    <header id="headerContent">
    </header>

    <main>

        <section id="hero" class="hero">
            <div class="hero-content-wrapper">

                <div class="hero-container" id="heroContent">
                </div>

            </div>
        </section>

        <section id="about" class="about">
            <div class="about-content-wrapper">
                <div class="about-content" id="aboutContent">
                </div>
            </div>
        </section>

        <section id="skills" class="skills ">
            <div class="skills-content-wrapper">
                <div class="skills-content" id="skillsContent">
                </div>
            </div>
        </section>

        <section id="projects" class="projects">
            <div class="projects-content-wrapper">
                <div class="projects-content" id="projectsContent">
                </div>
            </div>
        </section>

        <section id="contact" class="contact">
            <div class="contact-content-wrapper">

                <div class="contact-content" id="contactContent">
                </div>

                <footer id="footerContent">
                </footer>

            </div>
        </section>

    </main>

    <div id="successPopup" class="success-popup">
        <p data-i18n="popupSuccess">Message sent successfully!</p>
    </div>

    <div id="errorPopup" class="error-popup">
        <p data-i18n="popupError">Something went wrong. Please try again later.</p>
    </div>

</body>

<script src="./script/loadTemplates.js"></script>
<script src="./templates/heroTemplate.js"></script>
<script src="./templates/aboutTemplate.js"></script>
<script src="./templates/skillsTemplate.js"></script>
<script src="./templates/projectsTemplate.js"></script>
<script src="./templates/contactTemplate.js"></script>
<script src="./templates/headerTemplate.js"></script>
<script src="./templates/footerTemplate.js"></script>
<script src="./script/translations.js"></script>
<script src="./script.js"></script>

</html>

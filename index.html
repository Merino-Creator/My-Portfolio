<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <link rel="icon" type="image/x-icon" href="./assets/images/logo.png">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style/standard.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/footer.css">

</head>

<body>

    <header>
        <div class="content-wrapper">
            <div class="nav-bar">
                <img class="logo" src="./assets/images/logo.png" alt="logo of website in header">
                <div class="header-tabs">
                    <a href="">About me</a>
                    <a href="">Skills</a>
                    <a href="">Projects</a>
                    <a href="">Contact</a>
                </div>
                <div class="language-btn">
                    <p>EN</p>
                    <div class="vector"></div>
                    <p>DE</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="content-wrapper">
                <div class="hero-content"></div>
            </div>
        </section>
        <section class="about">
            <div class="content-wrapper">
                <div class="about-content"></div>
            </div>
        </section>
        <section class="skills ">
            <div class="content-wrapper">
                <div class="skills-content"></div>
            </div>
        </section>
        <section class="projects">
            <div class="content-wrapper">
                <div class="projects-content"></div>
            </div>
        </section>
        <section class="contact">
            <div class="content-wrapper">
                <div class="contact-content"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="content-wrapper">
            <div class="contact-bar">
                <div class="legal-notice">
                    <img class="logo" src="./assets/images/logo.png" alt="logo of website in footer">
                    <p>Daniel Stürmer 2026 </p>
                    <a href="">Legal Notice</a>
                </div>
                <a href="">GitHub</a>
                <a href="">LinkedIn</a>
                <a href="">Email</a>
            </div>
        </div>
    </footer>

</body>

</html>
